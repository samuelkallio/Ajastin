<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ajastin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #0f0f1a;
            --surface: #1a1a28;
            --surface-2: #242438;
            --surface-3: #30304a;
            --accent: #e94560;
            --accent-hover: #ff5b75;
            --secondary: #6c5ce7;
            --text: #f0f0f5;
            --text-muted: #9090a8;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 1rem;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background 0.35s;
        }

        body.dim-mode { background: #000; }

        .app {
            position: relative;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        /* ============ VIEWS ============ */
        .view {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
        }

        .view.active { display: flex; }

        /* ============ TIMER VIEW ============ */
        .view-timer { padding: 0; }

        .display-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            padding: 1rem;
            overflow: hidden;
        }

        .timer-display {
            font-size: 8rem; /* JS overrides */
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.02em;
            line-height: 1;
            color: var(--text);
            white-space: nowrap;
            transition: color 0.25s;
        }

        .timer-display.flash {
            animation: blink 0.6s ease-in-out infinite;
            color: var(--accent) !important;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.12; }
        }

        body.dim-mode .timer-display { color: #444; }

        /* Settings icon (top-right) */
        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            padding: 0.5rem;
            cursor: pointer;
            border-radius: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2.75rem;
            min-height: 2.75rem;
            transition: background 0.15s, color 0.15s;
            line-height: 1;
            flex-shrink: 0;
        }

        .icon-btn:hover { background: var(--surface-2); color: var(--text); }
        .icon-btn:active { background: var(--surface-3); }

        .settings-icon-btn {
            position: absolute;
            top: max(1rem, env(safe-area-inset-top));
            right: max(1rem, env(safe-area-inset-right));
            z-index: 10;
        }

        /* Hide settings icon unless idle */
        .view-timer:not([data-state="idle"]) .settings-icon-btn { display: none; }

        /* ============ CONTROLS ============ */
        .controls {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
            flex-wrap: wrap;
            width: 100%;
        }

        .btn {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            min-height: 3.5rem;
            color: var(--text);
            transition: transform 0.1s, background 0.15s, opacity 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }

        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover { background: var(--accent-hover); }

        .btn-secondary {
            background: var(--surface-3);
            color: var(--text);
        }
        .btn-secondary:hover { background: #3a3a5a; }

        .btn-danger {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
        }
        .btn-danger:hover { background: rgba(233, 69, 96, 0.1); }

        /* Larger Start button */
        .view-timer[data-state="idle"] #startBtn {
            padding: 1rem 4rem;
            font-size: 1.2rem;
        }

        /* Dim mode button styling */
        body.dim-mode .btn { opacity: 0.45; }

        /* Button visibility per state */
        .view-timer[data-state="idle"] #pauseBtn,
        .view-timer[data-state="idle"] #cancelBtn,
        .view-timer[data-state="idle"] #resumeBtn,
        .view-timer[data-state="idle"] #alarmResetBtn,
        .view-timer[data-state="running"] #startBtn,
        .view-timer[data-state="running"] #cancelBtn,
        .view-timer[data-state="running"] #resumeBtn,
        .view-timer[data-state="running"] #alarmResetBtn,
        .view-timer[data-state="paused"] #startBtn,
        .view-timer[data-state="paused"] #pauseBtn,
        .view-timer[data-state="paused"] #alarmResetBtn,
        .view-timer[data-state="alarm"] #startBtn,
        .view-timer[data-state="alarm"] #pauseBtn,
        .view-timer[data-state="alarm"] #cancelBtn,
        .view-timer[data-state="alarm"] #resumeBtn {
            display: none;
        }

        /* ============ SETTINGS VIEW ============ */
        .view-settings {
            background: var(--bg);
            overflow: hidden;
        }

        .settings-header {
            display: flex;
            align-items: center;
            padding: max(0.75rem, env(safe-area-inset-top)) 1rem 0.75rem;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .settings-header h1 {
            font-size: 1.15rem;
            font-weight: 600;
            margin: 0;
            flex: 1;
            text-align: center;
        }

        .settings-header .spacer { width: 2.75rem; }

        .settings-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem 1rem;
            padding-bottom: max(2rem, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .setting-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* Time inputs */
        .time-inputs {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1rem;
        }

        .time-input {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
        }

        .time-input input {
            width: 5rem;
            padding: 0.75rem;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            border: 2px solid transparent;
            border-radius: 0.75rem;
            background: var(--surface-2);
            color: var(--text);
            font-variant-numeric: tabular-nums;
            transition: border-color 0.15s;
            -moz-appearance: textfield;
        }

        .time-input input::-webkit-outer-spin-button,
        .time-input input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .time-input input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .time-input span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .time-sep {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-muted);
            padding-bottom: 1.2rem;
        }

        /* Sound list */
        .sound-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sound-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .sound-item:hover { background: var(--surface-2); }
        .sound-item:has(input:checked) { background: rgba(233, 69, 96, 0.1); }

        .sound-item input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
            transition: border-color 0.15s;
            margin: 0;
        }

        .sound-item input[type="radio"]:checked { border-color: var(--accent); }

        .sound-item input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: var(--accent);
        }

        .sound-item .sound-label {
            flex: 1;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
        }

        .test-btn {
            background: var(--surface-3);
            border: none;
            color: var(--text);
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.1s;
            flex-shrink: 0;
            padding: 0;
            line-height: 1;
        }

        .test-btn:hover { background: var(--accent); color: #fff; }
        .test-btn:active { transform: scale(0.9); }
        .test-btn.playing { background: var(--accent); color: #fff; }

        /* Toggle */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1rem;
            cursor: pointer;
            margin: 0;
        }

        .toggle-text {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            flex: 1;
        }

        .toggle-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
        }

        .toggle-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .switch {
            appearance: none;
            -webkit-appearance: none;
            width: 3rem;
            height: 1.75rem;
            background: var(--surface-3);
            border-radius: 1rem;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
            margin: 0;
        }

        .switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 1.25rem;
            height: 1.25rem;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .switch:checked { background: var(--accent); }
        .switch:checked::after { transform: translateX(1.25rem); }

        /* Share modal */
        .share-url-input {
            width: 100%;
            padding: 0.75rem;
            font-size: 0.95rem;
            border: none;
            border-radius: 0.75rem;
            background: var(--surface-2);
            color: var(--text);
            text-align: center;
            font-weight: 500;
            margin: 0.5rem 0;
        }

        .qr-container {
            display: flex;
            justify-content: center;
            margin: 1rem 0;
        }

        .qr-container img {
            max-width: 180px;
            max-height: 180px;
            border-radius: 0.5rem;
            background: #fff;
            padding: 0.5rem;
        }

        /* Version footer */
        .version-footer {
            text-align: center;
            padding: 0.5rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .version-footer button {
            background: none;
            border: none;
            color: var(--accent);
            font-size: inherit;
            cursor: pointer;
            text-decoration: underline;
            font-family: inherit;
            padding: 0;
        }

        /* ============ MODAL ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 100;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--surface);
            border-radius: 1.25rem;
            padding: 1.5rem;
            max-width: 22rem;
            width: 100%;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.5);
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal h2 {
            font-size: 1.15rem;
            margin: 0 0 1.5rem;
            text-align: center;
            font-weight: 600;
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
        }

        .modal-actions .btn { flex: 1; }
    </style>
</head>
<body>
<div class="app">

    <!-- ═══════════════ VIEW 1 & 2: TIMER (idle / running) ═══════════════ -->
    <section class="view view-timer active" id="viewTimer" data-state="idle">
        <button class="icon-btn settings-icon-btn" id="openSettingsBtn" aria-label="Avaa asetukset">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>

        <div class="display-wrap">
            <div class="timer-display" id="display">05:00</div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn">Käynnistä</button>
            <button class="btn btn-secondary" id="pauseBtn">Tauko</button>
            <button class="btn btn-danger" id="cancelBtn">Keskeytä</button>
            <button class="btn btn-primary" id="resumeBtn">Jatka</button>
            <button class="btn btn-secondary" id="alarmResetBtn">Nollaa</button>
        </div>
    </section>

    <!-- ═══════════════ VIEW 3: SETTINGS ═══════════════ -->
    <section class="view view-settings" id="viewSettings">
        <header class="settings-header">
            <button class="icon-btn" id="backBtn" aria-label="Takaisin">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
            </button>
            <h1>Asetukset</h1>
            <div class="spacer"></div>
        </header>

        <div class="settings-content">

            <!-- Aika -->
            <div class="setting-group">
                <label class="setting-label">Aika</label>
                <div class="time-inputs">
                    <div class="time-input">
                        <input id="minutesInput" type="number" inputmode="numeric" min="0" max="999" step="1" value="5">
                        <span>min</span>
                    </div>
                    <div class="time-sep">:</div>
                    <div class="time-input">
                        <input id="secondsInput" type="number" inputmode="numeric" min="0" max="59" step="1" value="0">
                        <span>s</span>
                    </div>
                </div>
            </div>

            <!-- Soittoääni -->
            <div class="setting-group">
                <label class="setting-label">Soittoääni</label>
                <div class="sound-list" id="soundList"></div>
            </div>

            <!-- Näyttö -->
            <div class="setting-group">
                <label class="setting-label">Näyttö</label>
                <label class="toggle-row">
                    <div class="toggle-text">
                        <span class="toggle-title">Himmennä näyttö ajon aikana</span>
                        <span class="toggle-desc">Säästää akkua erityisesti OLED-näytöillä</span>
                    </div>
                    <input type="checkbox" id="dimToggle" class="switch">
                </label>
            </div>

            <!-- Jaa -->
            <div class="setting-group">
                <label class="setting-label">Jaa</label>
                <button class="btn btn-secondary" id="openShareBtn" style="width:100%;">Jaa sovellus</button>
            </div>

            <div class="version-footer">
                Versio <button id="versionBtn" type="button">1.7.0</button>
            </div>

        </div>
    </section>

    <!-- ═══════════════ CONFIRM MODAL ═══════════════ -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>Keskeytetäänkö ajastus?</h2>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="confirmNo">Peruuta</button>
                <button class="btn btn-primary" id="confirmYes">Keskeytä</button>
            </div>
        </div>
    </div>

    <!-- ═══════════════ SHARE MODAL ═══════════════ -->
    <div class="modal-overlay" id="shareModal">
        <div class="modal">
            <h2>Jaa sovellus</h2>
            <input type="text" id="shareUrlInput" class="share-url-input" value="https://samuelkallio.github.io/Ajastin/" readonly onclick="this.select()">
            <button id="copyUrlBtn" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Kopioi linkki</button>
            <div class="qr-container">
                <img id="qrCode" src="" alt="QR-koodi" width="180" height="180">
            </div>
            <button id="closeShareModalBtn" class="btn btn-secondary" style="width:100%;">Sulje</button>
        </div>
    </div>

</div>

<script>
(function () {
    'use strict';

    /* ═══════════════ CONFIG ═══════════════ */
    const SOUNDS = [
        { file: 'school bell.m4a', label: 'School bell' },
        { file: 'horn.mp3',        label: 'Horn' },
        { file: 'ice hockey.m4a',  label: 'Ice hockey' },
    ];
    const DEFAULT_SOUND         = 'school bell.m4a';
    const DEFAULT_TOTAL_SECONDS = 300;
    const MAX_TOTAL_SECONDS     = 999 * 60 + 59;
    const CACHE_NAME            = 'ajastin-audio-v5';
    const APP_CACHE_NAME        = 'ajastin-app-v1';
    const APP_VERSION           = '1.7.0';
    const START_BEEP_MS         = 1000;
    const FLASH_DURATION_MS     = 10000;
    const SHARE_URL             = 'https://samuelkallio.github.io/Ajastin/';

    /* ═══════════════ STATE ═══════════════ */
    let mode = 'idle';                  // idle | running | paused | alarm
    let totalSeconds = DEFAULT_TOTAL_SECONDS;
    let timerEndTime = 0;
    let pausedRemainingMs = 0;
    let intervalId = null;

    let currentSound = DEFAULT_SOUND;
    let dimMode = true;

    /* Audio */
    const audioPool = {};
    const soundUrls = {};
    let audioUnlocked = false;
    let startBeepTimer = null;
    let previewFile = null;
    let previewTimeout = null;

    /* Web Audio boost */
    let audioCtx = null;
    let masterGain = null;
    let mediaSources = {};
    let audioBoostInitialized = false;

    /* Fallback beep */
    let fallbackOsc = null;
    let fallbackGain = null;

    /* Flash timer */
    let flashStopTimer = null;

    /* Wake Lock */
    let wakeLock = null;
    const wakeLockSupported = 'wakeLock' in navigator;

    /* ═══════════════ DOM ═══════════════ */
    const $ = id => document.getElementById(id);
    const viewTimer     = $('viewTimer');
    const viewSettings  = $('viewSettings');
    const display       = $('display');
    const startBtn      = $('startBtn');
    const pauseBtn      = $('pauseBtn');
    const cancelBtn     = $('cancelBtn');
    const resumeBtn     = $('resumeBtn');
    const alarmResetBtn = $('alarmResetBtn');
    const openSettingsBtn = $('openSettingsBtn');
    const backBtn       = $('backBtn');
    const minutesInput  = $('minutesInput');
    const secondsInput  = $('secondsInput');
    const soundListEl   = $('soundList');
    const dimToggle     = $('dimToggle');
    const confirmModal  = $('confirmModal');
    const confirmYes    = $('confirmYes');
    const confirmNo     = $('confirmNo');
    const versionBtn    = $('versionBtn');
    const openShareBtn  = $('openShareBtn');
    const shareModal    = $('shareModal');
    const shareUrlInput = $('shareUrlInput');
    const copyUrlBtn    = $('copyUrlBtn');
    const qrCodeImg     = $('qrCode');
    const closeShareModalBtn = $('closeShareModalBtn');

    /* ═══════════════ UTILS ═══════════════ */
    function formatTime(total) {
        const m = Math.floor(total / 60);
        const s = total % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
    }

    /* ═══════════════ DISPLAY FITTING ═══════════════ */
    let measurer = null;
    let lastLen = 0;

    function fitDisplay() {
        if (!viewTimer.classList.contains('active')) return;
        const wrap = display.parentElement;
        const availW = wrap.clientWidth - 16;
        const availH = wrap.clientHeight - 16;
        if (availW <= 0 || availH <= 0) return;

        const cs = getComputedStyle(display);

        if (!measurer) {
            measurer = document.createElement('span');
            measurer.style.cssText =
                'position:fixed;visibility:hidden;white-space:nowrap;' +
                'left:-9999px;top:-9999px;line-height:1;padding:0;margin:0;';
            document.body.appendChild(measurer);
        }

        measurer.style.fontFamily     = cs.fontFamily;
        measurer.style.fontWeight     = cs.fontWeight;
        measurer.style.fontVariantNumeric = 'tabular-nums';
        measurer.style.letterSpacing  = cs.letterSpacing;
        measurer.style.fontSize       = '100px';
        measurer.textContent          = display.textContent;

        const tw = measurer.offsetWidth;
        const th = measurer.offsetHeight;
        if (tw <= 0 || th <= 0) return;

        const scale = Math.min(availW / tw, availH / th) * 0.98;
        display.style.fontSize = (100 * scale) + 'px';
    }

    function setDisplay(seconds) {
        const text = formatTime(seconds);
        if (display.textContent !== text) display.textContent = text;

        if (text.length !== lastLen) {
            lastLen = text.length;
            requestAnimationFrame(fitDisplay);
        }
    }

    /* ═══════════════ STATE / VIEW ═══════════════ */
    function setMode(newMode) {
        mode = newMode;
        viewTimer.dataset.state = newMode;
        document.body.classList.toggle('dim-mode', newMode === 'running' && dimMode);
    }

    function switchView(name) {
        viewTimer.classList.toggle('active', name === 'timer');
        viewSettings.classList.toggle('active', name === 'settings');
        if (name === 'timer') requestAnimationFrame(fitDisplay);
    }

    /* ═══════════════ TIMER LOGIC ═══════════════ */
    function tick() {
        if (mode !== 'running') return;

        const remainingMs = Math.max(0, timerEndTime - Date.now());
        const displaySec = Math.ceil(remainingMs / 1000);
        setDisplay(displaySec);

        if (remainingMs <= 0) {
            clearInterval(intervalId);
            intervalId = null;
            handleAlarm();
        }
    }

    function startTimer() {
        if (mode === 'running' || mode === 'alarm') return;
        unlockAudio();

        if (mode === 'idle') {
            const total = readInputsAsSeconds();
            if (total <= 0) return;
            totalSeconds = total;
            timerEndTime = Date.now() + total * 1000;
            playStartBeep();
        } else if (mode === 'paused') {
            timerEndTime = Date.now() + pausedRemainingMs;
        }

        setMode('running');
        tick();
        intervalId = setInterval(tick, 100);
        requestWakeLock();
    }

    function pauseTimer() {
        if (mode !== 'running') return;
        pausedRemainingMs = Math.max(0, timerEndTime - Date.now());
        clearInterval(intervalId);
        intervalId = null;
        stopStartBeep();
        setMode('paused');
    }

    function resumeTimer() {
        if (mode !== 'paused') return;
        timerEndTime = Date.now() + pausedRemainingMs;
        setMode('running');
        tick();
        intervalId = setInterval(tick, 100);
        requestWakeLock();
    }

    function cancelTimer() {
        if (mode !== 'paused') return;
        confirmModal.classList.add('open');
    }

    function handleAlarm() {
        setMode('alarm');
        setDisplay(0);
        display.classList.add('flash');
        playAlarmSound();

        // Flash for 10 seconds, then automatically return to the start view.
        // No reset button press needed after the flash ends.
        if (flashStopTimer) clearTimeout(flashStopTimer);
        flashStopTimer = setTimeout(() => {
            flashStopTimer = null;
            resetToIdle();
        }, FLASH_DURATION_MS);
    }

    function resetToIdle() {
        stopAlarmSound();
        display.classList.remove('flash');
        if (flashStopTimer) {
            clearTimeout(flashStopTimer);
            flashStopTimer = null;
        }
        clearInterval(intervalId);
        intervalId = null;
        timerEndTime = 0;
        pausedRemainingMs = 0;
        totalSeconds = readInputsAsSeconds();
        setDisplay(totalSeconds);
        setMode('idle');
        releaseWakeLock();
    }

    /* ═══════════════ INPUTS ═══════════════ */
    function readInputsAsSeconds() {
        const m = clamp(parseInt(minutesInput.value, 10) || 0, 0, 999);
        const s = clamp(parseInt(secondsInput.value, 10) || 0, 0, 59);
        return m * 60 + s;
    }

    function onTimeInput() {
        totalSeconds = readInputsAsSeconds();
        saveTotalSeconds(totalSeconds);
        if (mode === 'idle') setDisplay(totalSeconds);
    }

    function normalizeMinutesInput() {
        let v = parseInt(minutesInput.value, 10);
        if (isNaN(v) || v < 0) v = 0;
        if (v > 999) v = 999;
        minutesInput.value = v;
        onTimeInput();
    }

    function normalizeSecondsInput() {
        let v = parseInt(secondsInput.value, 10);
        if (isNaN(v) || v < 0) v = 0;
        if (v > 59) v = 59;
        secondsInput.value = v;
        onTimeInput();
    }

    /* ═══════════════ PERSISTENCE ═══════════════ */
    function saveTotalSeconds(v) {
        try { localStorage.setItem('ajastin_total_seconds', String(v)); } catch (e) {}
    }

    function loadTotalSeconds() {
        const v = parseInt(localStorage.getItem('ajastin_total_seconds'), 10);
        if (isNaN(v) || v < 0) return DEFAULT_TOTAL_SECONDS;
        return clamp(v, 0, MAX_TOTAL_SECONDS);
    }

    function saveDimMode() {
        try { localStorage.setItem('ajastin_dim_mode', dimMode ? '1' : '0'); } catch (e) {}
    }

    function loadDimMode() {
        const v = localStorage.getItem('ajastin_dim_mode');
        dimMode = (v === null) ? true : (v === '1');
    }

    function saveSound() {
        try { localStorage.setItem('ajastin_sound', currentSound); } catch (e) {}
    }

    function loadSound() {
        const v = localStorage.getItem('ajastin_sound');
        currentSound = (v && SOUNDS.some(s => s.file === v)) ? v : DEFAULT_SOUND;
    }

    /* ═══════════════ AUDIO ═══════════════ */
    function getSoundUrl(file) {
        return soundUrls[file] || file;
    }

    function initAudio() {
        SOUNDS.forEach(s => {
            const a = new Audio();
            a.preload = 'auto';
            a.volume = 1.0;
            a.loop = false;
            audioPool[s.file] = a;
            a.src = getSoundUrl(s.file);
        });
    }

    async function cacheAudio() {
        if (!('caches' in window) || location.protocol === 'file:') {
            SOUNDS.forEach(s => { soundUrls[s.file] = s.file; });
            Object.keys(audioPool).forEach(f => { audioPool[f].src = getSoundUrl(f); });
            return;
        }
        try {
            const cache = await caches.open(CACHE_NAME);
            for (const s of SOUNDS) {
                try {
                    let resp = await cache.match(s.file);
                    if (!resp) {
                        await cache.add(s.file);
                        resp = await cache.match(s.file);
                    }
                    if (resp) {
                        const blob = await resp.blob();
                        const oldUrl = soundUrls[s.file];
                        if (oldUrl && oldUrl.startsWith('blob:')) URL.revokeObjectURL(oldUrl);
                        soundUrls[s.file] = URL.createObjectURL(blob);
                    }
                } catch (e) {
                    console.warn('Cache failed for', s.file, e);
                }
            }
        } catch (e) {
            console.warn('Cache init failed', e);
        }
        SOUNDS.forEach(s => {
            if (!soundUrls[s.file]) soundUrls[s.file] = s.file;
            if (audioPool[s.file]) audioPool[s.file].src = getSoundUrl(s.file);
        });
    }

    /* ── Web Audio boost ── */
    function initAudioContext() {
        if (audioCtx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try {
            audioCtx = new AC();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 1.5; // boost
            masterGain.connect(audioCtx.destination);
        } catch (e) {
            console.warn('AudioContext init failed', e);
        }
    }

    function setupAudioBoost() {
        if (!audioCtx || !masterGain) return;
        if (audioBoostInitialized) return;
        audioBoostInitialized = true;
        Object.keys(audioPool).forEach(file => {
            if (mediaSources[file]) return;
            try {
                const el = audioPool[file];
                const src = audioCtx.createMediaElementSource(el);
                src.connect(masterGain);
                mediaSources[file] = src;
            } catch (e) {
                console.warn('MediaElementSource failed for', file, e);
            }
        });
    }

    function unlockAudio() {
        if (audioUnlocked) return;
        audioUnlocked = true;
        initAudioContext();
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
        setupAudioBoost();
        SOUNDS.forEach(s => {
            const a = audioPool[s.file];
            if (!a) return;
            try {
                const v = a.volume;
                a.volume = 0.001;
                const p = a.play();
                if (p && p.then) {
                    p.then(() => {
                        setTimeout(() => {
                            try { a.pause(); a.currentTime = 0; } catch (e) {}
                            a.volume = v;
                        }, 30);
                    }).catch(() => { a.volume = v; });
                } else {
                    setTimeout(() => {
                        try { a.pause(); a.currentTime = 0; } catch (e) {}
                        a.volume = v;
                    }, 30);
                }
            } catch (e) {}
        });
    }

    function playStartBeep() {
        stopStartBeep();
        const a = audioPool[currentSound];
        if (!a) return;
        try { a.pause(); a.currentTime = 0; } catch (e) {}
        a.volume = 1.0;
        a.loop = false;
        const p = a.play();
        if (p && p.catch) p.catch(() => {});
        startBeepTimer = setTimeout(() => {
            try { a.pause(); a.currentTime = 0; } catch (e) {}
            startBeepTimer = null;
        }, START_BEEP_MS);
    }

    function stopStartBeep() {
        if (startBeepTimer) {
            clearTimeout(startBeepTimer);
            startBeepTimer = null;
        }
        const a = audioPool[currentSound];
        if (a) { try { a.pause(); a.currentTime = 0; } catch (e) {} }
    }

    function playAlarmSound() {
        stopStartBeep();
        stopPreview();
        const a = audioPool[currentSound];
        if (!a) return;
        try { a.pause(); a.currentTime = 0; } catch (e) {}
        a.volume = 1.0;
        a.loop = false;
        const p = a.play();
        if (p && p.catch) {
            p.catch(err => {
                console.warn('Alarm blocked, fallback', err);
                fallbackBeep(0.5);
            });
        }
    }

    function stopAlarmSound() {
        const a = audioPool[currentSound];
        if (a) { try { a.pause(); a.currentTime = 0; } catch (e) {} }
        stopFallback();
    }

    function fallbackBeep(gain) {
        try {
            if (!audioCtx || audioCtx.state === 'closed') {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                audioCtx = new AC();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            stopFallback();
            fallbackOsc  = audioCtx.createOscillator();
            fallbackGain = audioCtx.createGain();
            fallbackOsc.type = 'square';
            fallbackOsc.frequency.value = 880;
            fallbackGain.gain.value = gain;
            // Connect to masterGain if available, else destination
            const dest = masterGain || audioCtx.destination;
            fallbackOsc.connect(fallbackGain).connect(dest);
            fallbackOsc.start();
            setTimeout(() => stopFallback(), 3000);
        } catch (e) {}
    }

    function stopFallback() {
        if (fallbackOsc) {
            try { fallbackOsc.stop(); fallbackOsc.disconnect(); } catch (e) {}
            fallbackOsc = null;
        }
        if (fallbackGain) {
            try { fallbackGain.disconnect(); } catch (e) {}
            fallbackGain = null;
        }
    }

    /* ═══════════════ PREVIEW (settings) ═══════════════ */
    function playPreview(file) {
        unlockAudio();
        stopPreview();
        stopStartBeep();
        const a = audioPool[file];
        if (!a) return;
        try { a.pause(); a.currentTime = 0; } catch (e) {}
        a.volume = 1.0;
        a.loop = false;
        previewFile = file;

        const onEnded = () => {
            a.removeEventListener('ended', onEnded);
            if (previewFile === file) {
                previewFile = null;
                updateTestButtons();
            }
        };
        a.addEventListener('ended', onEnded);

        const p = a.play();
        if (p && p.catch) p.catch(() => fallbackBeep(0.3));
        updateTestButtons();

        previewTimeout = setTimeout(() => {
            if (previewFile === file) {
                try { a.pause(); a.currentTime = 0; } catch (e) {}
                previewFile = null;
                updateTestButtons();
            }
        }, 5000);
    }

    function stopPreview() {
        if (previewTimeout) {
            clearTimeout(previewTimeout);
            previewTimeout = null;
        }
        if (previewFile) {
            const a = audioPool[previewFile];
            if (a) { try { a.pause(); a.currentTime = 0; } catch (e) {} }
            previewFile = null;
        }
        stopFallback();
        updateTestButtons();
    }

    function updateTestButtons() {
        document.querySelectorAll('.test-btn').forEach(btn => {
            const playing = previewFile === btn.dataset.file;
            btn.classList.toggle('playing', playing);
            btn.textContent = playing ? '⏹' : '▶';
        });
    }

    /* ═══════════════ SOUND LIST ═══════════════ */
    function renderSoundList() {
        soundListEl.innerHTML = '';
        SOUNDS.forEach(s => {
            const item = document.createElement('label');
            item.className = 'sound-item';

            const radio = document.createElement('input');
            radio.type  = 'radio';
            radio.name  = 'sound';
            radio.value = s.file;
            radio.checked = s.file === currentSound;
            radio.addEventListener('change', () => {
                if (radio.checked) {
                    currentSound = s.file;
                    saveSound();
                    stopPreview();
                }
            });

            const lbl = document.createElement('span');
            lbl.className   = 'sound-label';
            lbl.textContent = s.label;

            const testBtn = document.createElement('button');
            testBtn.type = 'button';
            testBtn.className = 'test-btn';
            testBtn.dataset.file = s.file;
            testBtn.textContent = '▶';
            testBtn.setAttribute('aria-label', 'Testaa ' + s.label);
            testBtn.addEventListener('click', e => {
                e.preventDefault();
                e.stopPropagation();
                if (previewFile === s.file) stopPreview();
                else playPreview(s.file);
            });

            item.appendChild(radio);
            item.appendChild(lbl);
            item.appendChild(testBtn);
            soundListEl.appendChild(item);
        });
        updateTestButtons();
    }

    /* ═══════════════ SHARE MODAL ═══════════════ */
    function openShareModal() {
        shareUrlInput.value = SHARE_URL;
        qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(SHARE_URL)}`;
        shareModal.classList.add('open');
    }

    function closeShareModal() {
        shareModal.classList.remove('open');
    }

    openShareBtn.addEventListener('click', openShareModal);
    closeShareModalBtn.addEventListener('click', closeShareModal);
    shareModal.addEventListener('click', e => {
        if (e.target === shareModal) closeShareModal();
    });

    copyUrlBtn.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(SHARE_URL);
            copyUrlBtn.textContent = 'Kopioitu!';
            setTimeout(() => { copyUrlBtn.textContent = 'Kopioi linkki'; }, 1500);
        } catch (err) {
            shareUrlInput.select();
            try { document.execCommand('copy'); } catch (e) {}
            copyUrlBtn.textContent = 'Kopioitu!';
            setTimeout(() => { copyUrlBtn.textContent = 'Kopioi linkki'; }, 1500);
        }
    });

    /* ═══════════════ WAKE LOCK ═══════════════ */
    async function requestWakeLock() {
        if (!wakeLockSupported) return;
        if (document.visibilityState !== 'visible') return;
        if (wakeLock) return;
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (e) {
            wakeLock = null;
        }
    }

    async function releaseWakeLock() {
        if (wakeLock) {
            try { await wakeLock.release(); } catch (e) {}
            wakeLock = null;
        }
    }

    /* ═══════════════ EVENTS ═══════════════ */
    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resumeBtn.addEventListener('click', resumeTimer);
    cancelBtn.addEventListener('click', cancelTimer);
    alarmResetBtn.addEventListener('click', resetToIdle);

    confirmYes.addEventListener('click', () => {
        confirmModal.classList.remove('open');
        if (mode === 'paused') resetToIdle();
    });
    confirmNo.addEventListener('click', () => confirmModal.classList.remove('open'));
    confirmModal.addEventListener('click', e => {
        if (e.target === confirmModal) confirmModal.classList.remove('open');
    });

    openSettingsBtn.addEventListener('click', () => switchView('settings'));
    backBtn.addEventListener('click', () => {
        stopPreview();
        switchView('timer');
    });

    minutesInput.addEventListener('input', onTimeInput);
    secondsInput.addEventListener('input', onTimeInput);
    minutesInput.addEventListener('blur', normalizeMinutesInput);
    secondsInput.addEventListener('blur', normalizeSecondsInput);

    dimToggle.addEventListener('change', () => {
        dimMode = dimToggle.checked;
        saveDimMode();
        document.body.classList.toggle('dim-mode', mode === 'running' && dimMode);
    });

    versionBtn.addEventListener('click', async () => {
        if (!confirm('Päivitetäänkö sovellus? Välimuistit tyhjennetään.')) return;
        try {
            if ('caches' in window) {
                const names = await caches.keys();
                await Promise.all(names.map(n => caches.delete(n)));
            }
            if ('serviceWorker' in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map(r => r.unregister()));
            }
            Object.values(soundUrls).forEach(u => {
                if (u && u.startsWith('blob:')) {
                    try { URL.revokeObjectURL(u); } catch (e) {}
                }
            });
        } catch (e) {}
        const url = location.href.split('?')[0];
        location.href = url + '?v=' + Date.now();
    });

    /* Unlock on first gesture */
    ['touchstart', 'click', 'pointerdown', 'keydown'].forEach(evt => {
        window.addEventListener(evt, () => {
            unlockAudio();
            requestWakeLock();
        }, { once: true, passive: true });
    });

    /* Visibility change */
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            requestWakeLock();
            if (mode === 'running') tick();
        }
    });

    /* Resize */
    let resizeTimer = null;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(fitDisplay, 100);
    });
    window.addEventListener('orientationchange', () => setTimeout(fitDisplay, 200));

    /* ═══════════════ OFFLINE CACHING (app shell) ═══════════════ */
    async function cacheAppShell() {
        if (!('caches' in window) || location.protocol === 'file:') return;
        try {
            const cache = await caches.open(APP_CACHE_NAME);
            await cache.add(location.href);
            console.log('App shell cached for offline use');
        } catch (e) {
            console.warn('App shell cache failed', e);
        }
    }

    /* Try to register a service worker if available (sw.js) */
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    /* ═══════════════ INIT ═══════════════ */
    function init() {
        loadSound();
        loadDimMode();

        const saved = loadTotalSeconds();
        totalSeconds = saved;
        minutesInput.value = Math.floor(saved / 60);
        secondsInput.value = saved % 60;
        dimToggle.checked  = dimMode;

        renderSoundList();
        initAudio();
        cacheAudio();
        cacheAppShell();

        setDisplay(saved);
        setMode('idle');
        versionBtn.textContent = APP_VERSION;
        requestWakeLock();

        console.log('Ajastin ' + APP_VERSION + ' valmis.',
            '| Ääni:', currentSound,
            '| Himmennys:', dimMode ? 'päällä' : 'pois',
            '| Wake Lock:', wakeLockSupported ? 'tuettu' : 'ei tuettu');
    }

    init();
})();
</script>
</body>
</html>
